<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Order Your Merch | Life, Love, Christ</title>
<style>
  :root {
    --bg:#f4f4f6; --fg:#1a1a1a; --card:#fff; --stage:#f5f5f7; --line:#d0d0d6; --sum:#f7f7f9; --btn:#1a1a1a; --btnfg:#fff; --btnh:#333; --mut:#6b6b73;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); color-scheme:light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#141416; --fg:#f1f1f3; --card:#1f1f23; --line:#3a3a42; --sum:#2a2a30; --btn:#f1f1f3; --btnfg:#141416; --btnh:#d8d8dc; --mut:#a0a0a8; color-scheme:dark; }
  }
  :root[data-theme="dark"] { --bg:#141416; --fg:#f1f1f3; --card:#1f1f23; --line:#3a3a42; --sum:#2a2a30; --btn:#f1f1f3; --btnfg:#141416; --btnh:#d8d8dc; --mut:#a0a0a8; color-scheme:dark; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  .wrap { max-width:1000px; margin:0 auto; padding:24px; display:grid; gap:24px; grid-template-columns:1.05fr 1fr; align-items:start; }
  @media (max-width:760px) { .wrap { grid-template-columns:1fr; } }
  .card { background:var(--card); border-radius:16px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,.06); }
  h1 { grid-column:1/-1; margin:0; font-size:24px; }
  .viewer { padding:12px; }
  .stage { position:relative; width:100%; aspect-ratio:4/5; overflow:hidden; border-radius:12px; background:var(--stage); touch-action:none; cursor:grab; user-select:none; -webkit-user-select:none; }
  .stage:active { cursor:grabbing; }
  .stage img { position:absolute; left:0; top:0; max-width:none; will-change:transform; pointer-events:none; -webkit-user-drag:none; }
  .hint { font-size:13px; color:var(--mut); text-align:center; margin:10px 0 0; }
  .tabs { display:flex; gap:8px; flex-wrap:wrap; }
  .tab { padding:8px 14px; border:1px solid var(--line); border-radius:999px; background:var(--card); color:var(--fg); font-size:14px; cursor:pointer; }
  .tab.active { background:var(--btn); color:var(--btnfg); border-color:var(--btn); }
  label { display:block; font-weight:600; font-size:14px; margin:18px 0 8px; }
  .tabs + label { margin-top:20px; }
  input[type=number], select { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:16px; background:var(--card); color:var(--fg); }
  .row { display:flex; gap:12px; } .row > div { flex:1; }
  .colors { display:flex; gap:12px; }
  .col { display:flex; align-items:center; gap:10px; padding:8px 16px 8px 8px; border:2px solid var(--line); border-radius:999px; background:var(--card); color:var(--fg); font-size:15px; cursor:pointer; }
  .col i { width:28px; height:28px; border-radius:50%; box-shadow:inset 0 0 0 1px rgba(128,128,128,.5); }
  .col[aria-pressed="true"] { border-color:var(--fg); font-weight:700; }
  .summary { margin-top:20px; padding:14px; background:var(--sum); border-radius:10px; font-size:14px; line-height:1.6; }
  button.order { margin-top:16px; width:100%; padding:14px; font-size:16px; font-weight:600; background:var(--btn); color:var(--btnfg); border:0; border-radius:10px; cursor:pointer; }
  button.order:hover { background:var(--btnh); }
  :focus-visible { outline:2px solid #3b82f6; outline-offset:2px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Order Your Merch</h1>

  <div class="card viewer">
    <div class="stage" id="stage"><img id="img" alt="Life, Love, Christ merch in black and white"></div>
    <p class="hint">Swipe left or right to switch between black and white</p>
  </div>

  <div class="card">
    <div class="tabs" id="items">
      <button class="tab" data-k="tee">T-shirt · ₦10,000</button>
      <button class="tab" data-k="hoodie">Hoodie · ₦15,000</button>
    </div>

    <label>Color</label>
    <div class="colors">
      <button class="col" data-c="0" aria-pressed="true"><i style="background:#111"></i>Black</button>
      <button class="col" data-c="1" aria-pressed="false"><i style="background:#fff"></i>White</button>
    </div>

    <div class="row">
      <div><label for="size">Size</label>
        <select id="size"><option>S</option><option>M</option><option selected>L</option><option>XL</option><option>XXL</option></select></div>
      <div><label for="qty">Quantity</label><input type="number" id="qty" min="1" value="1"></div>
    </div>

    <div class="summary" id="summary"></div>
    <button class="order" id="orderBtn">Place order</button>
  </div>
</div>

  };
  const COLORS = ["Black","White"];
  const money = n => "₦" + n.toLocaleString("en-NG");
  const qty = () => Math.max(1, parseInt($("qty").value, 10) || 1);
  const state = {item:"tee", color:0};
  const $ = id => document.getElementById(id);
  const stage = $("stage"), img = $("img");
  let pos = 0, drag = null, raf = 0, lastD = 0;     // pos: 0 = black garment, 1 = white garment

  function place() {
    const it = ITEMS[state.item], W = stage.clientWidth, H = stage.clientHeight, S = 1.5, size = W*S;
    img.style.width = size + "px"; img.style.height = size + "px";
    const cx = it.cx[0] + (it.cx[1]-it.cx[0])*pos;
    img.style.transform = `translate(${W/2 - cx*size}px, ${H/2 - it.cy*size}px)`;
  }
  function glide(target) {
    cancelAnimationFrame(raf);
    (function step() { const d = target - pos; if (Math.abs(d) < .002) { pos = target; place(); return; } pos += d*.18; place(); raf = requestAnimationFrame(step); })();
  }
  function setColor(c, animate) { state.color = c; glide(c); render(); }

  function render() {
    const it = ITEMS[state.item];
    if (img.getAttribute("data-k") !== state.item) { img.src = it.src; img.setAttribute("data-k", state.item); }
    document.querySelectorAll("#items .tab").forEach(b => b.classList.toggle("active", b.dataset.k === state.item));
    document.querySelectorAll(".col").forEach(b => b.setAttribute("aria-pressed", +b.dataset.c === state.color));
    $("summary").innerHTML = `<b>Item:</b> ${it.label}<br><b>Color:</b> ${COLORS[state.color]}<br><b>Size:</b> ${$("size").value} &nbsp; <b>Qty:</b> ${qty()}<br><b>Price:</b> ${money(it.price)} each<br><b style="font-size:16px">Total: ${money(it.price*qty())}</b>`;
  }

  document.querySelectorAll("#items .tab").forEach(b => b.onclick = () => { state.item = b.dataset.k; render(); place(); });
  document.querySelectorAll(".col").forEach(b => b.onclick = () => setColor(+b.dataset.c));
  ["size","qty"].forEach(id => $(id).addEventListener("input", render));

  // swipe / drag to move between the black and the white garment
  stage.addEventListener("pointerdown", e => { drag = e.clientX; lastD = 0; cancelAnimationFrame(raf); stage.setPointerCapture(e.pointerId); });
  stage.addEventListener("pointermove", e => {
    if (drag === null) return;
    lastD = e.clientX - drag; drag = e.clientX;
    pos = Math.max(-.08, Math.min(1.08, pos - lastD/(stage.clientWidth*.9))); place();
  });
  ["pointerup","pointercancel"].forEach(t => stage.addEventListener(t, () => {
    if (drag === null) return; drag = null;
    setColor((pos - lastD/(stage.clientWidth*.9)*4) > .5 ? 1 : 0);
  }));

  $("orderBtn").onclick = () => {
    const it = ITEMS[state.item];
    const msg = `New order:\nItem: ${it.label}\nColor: ${COLORS[state.color]}\nSize: ${$("size").value}\nQuantity: ${qty()}\nPrice: ${money(it.price)} each\nTotal: ${money(it.price*qty())}`;
    window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, "_blank");
  };
  addEventListener("resize", place);
  img.onload = place; render(); place();
</script>
